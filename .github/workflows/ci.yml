name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  database:
    name: Database security tests (RLS)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pl8_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pl8_test
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-db.sh

  secrets:
    name: No privileged keys in the repo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a Supabase secret / service-role key is committed
        run: |
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{10,}|service_role"?\s*[:=]\s*"?eyJ' -- . ':!.github/workflows/ci.yml'; then
            echo "A privileged Supabase key was found. Remove it and rotate the key."; exit 1
          fi
